          git config user.name "GitHub Actions"
          git add -A
          git commit -m "apply f50-clash-subscription-fix.patch (订阅导入修复)" \
            --author="GitHub Actions <actions@github.com>"
          echo '已应用并提交 1 个补丁：订阅导入修复'

      - name: 校验构建依赖
        run: |
          for tool in git docker curl zip unzip; do
            command -v "${tool}" >/dev/null || { echo "缺少 ${tool}"; exit 1; }
          done
          docker version --format 'Docker {{.Server.Version}}'

      - name: 执行官方构建 build.sh
        run: ./build.sh

      - name: 校验制品 SHA-256
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -s "release/f50mgr-${VERSION}.zip"
          (cd release && sha256sum -c "f50mgr-${VERSION}.zip.sha256")
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: 上传编译产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f50mgr-online-build-带补丁
          path: |
            release/f50mgr-${{ env.VERSION }}.zip
            release/f50mgr-${{ env.VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 编译摘要
