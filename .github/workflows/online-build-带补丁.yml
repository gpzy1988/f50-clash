name: Online Build（带补丁）

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要编译的分支或标签（留空 = 默认分支）
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: f50mgr 在线编译（带补丁）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: 检出完整 Git 历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
