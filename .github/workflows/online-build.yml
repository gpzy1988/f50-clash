name: Online Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要编译的分支或标签（留空 = 默认分支）
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: f50mgr 在线编译
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: 检出完整 Git 历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 校验构建依赖
        run: |
          for tool in git docker curl zip unzip; do
            command -v "${tool}" >/dev/null || { echo "缺少 ${tool}"; exit 1; }
          done
          docker version --format 'Docker {{.Server.Version}}'

      - name: 执行官方构建 build.sh
        run: ./build.sh

      - name: 校验制品 SHA-256
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -s "release/f50mgr-${VERSION}.zip"
          (cd release && sha256sum -c "f50mgr-${VERSION}.zip.sha256")
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: 上传编译产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f50mgr-online-build
          path: |
            release/f50mgr-${{ env.VERSION }}.zip
            release/f50mgr-${{ env.VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 编译摘要
        run: |
          echo "构建完成, 产物:"
          ls -lh release/
          echo "下载: Actions 页 → 本次运行 → 底部 Artifacts → f50mgr-online-build"
#（注：内容由AI生成）
